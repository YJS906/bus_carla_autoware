/**:
  ros__parameters:
    drivable_area_right_bound_offset: 0.0
    drivable_area_left_bound_offset: 0.0
    drivable_area_types_to_skip:
    - road_border
    dynamic_expansion:
      enabled: true
      print_runtime: false
      max_expansion_distance: 3.5
      min_bound_interval: 1.0
      smoothing:
        curvature_average_window: 3
        max_bound_rate: 1.0
        arc_length_range: 8.0
      ego:
        extra_wheelbase: 0.0
        extra_front_overhang: 0.5
        extra_width: 1.4 # request 0.4 m more free corridor; road/object expansion limits still apply
      object_exclusion:
        exclude_static: true
        exclude_dynamic: true
        th_stopped_object_velocity: 1.0
        safety_margin:
          front: 0.75
          rear: 0.75
          left: 0.75
          right: 0.75
      path_preprocessing:
        max_arc_length: 100.0
        resample_interval: 2.0
        reuse_max_deviation: 0.5
      avoid_linestring:
        types:
        - road_border
        - curbstone
        - line_thin.solid
        - line_thick.solid
        distance: 0.1

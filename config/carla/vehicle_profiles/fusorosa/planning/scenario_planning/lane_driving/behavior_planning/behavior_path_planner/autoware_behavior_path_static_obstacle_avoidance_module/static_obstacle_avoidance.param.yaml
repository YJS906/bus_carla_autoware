# Bus-specific conservative static object clearance.
/**:
  ros__parameters:
    avoidance:
      resample_interval_for_planning: 0.3
      resample_interval_for_output: 1.0
      use_lane_type: same_direction_lane
      use_intersection_areas: true
      use_hatched_road_markings: true
      use_freespace_areas: true
      target_object:
        car:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.5
          lateral_margin:
            soft_margin: 0.8
            hard_margin: 0.4
            hard_margin_for_parked_vehicle: 0.4
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        truck:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.5
          lateral_margin:
            soft_margin: 0.8
            hard_margin: 0.4
            hard_margin_for_parked_vehicle: 0.4
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        bus:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.5
          lateral_margin:
            soft_margin: 0.8
            hard_margin: 0.4
            hard_margin_for_parked_vehicle: 0.4
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        trailer:
          th_moving_speed: 1.0
          th_moving_time: 2.0
          longitudinal_margin: 0.5
          lateral_margin:
            soft_margin: 0.8
            hard_margin: 0.4
            hard_margin_for_parked_vehicle: 0.4
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        unknown:
          th_moving_speed: 0.28
          th_moving_time: 1.0
          longitudinal_margin: 0.0
          lateral_margin:
            soft_margin: 0.5
            hard_margin: 0.1
            hard_margin_for_parked_vehicle: 0.1
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        bicycle:
          th_moving_speed: 0.28
          th_moving_time: 1.0
          longitudinal_margin: 0.5
          lateral_margin:
            soft_margin: 0.8
            hard_margin: 0.4
            hard_margin_for_parked_vehicle: 0.4
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        motorcycle:
          th_moving_speed: 1.0
          th_moving_time: 1.0
          longitudinal_margin: 0.5
          lateral_margin:
            soft_margin: 0.8
            hard_margin: 0.4
            hard_margin_for_parked_vehicle: 0.4
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        pedestrian:
          th_moving_speed: 0.28
          th_moving_time: 1.0
          longitudinal_margin: 0.6
          lateral_margin:
            soft_margin: 0.7
            hard_margin: 0.1
            hard_margin_for_parked_vehicle: 0.1
          max_expand_ratio: 0.0
          envelope_buffer_margin: 0.1
          th_error_eclipse_long_radius: 0.6
        lower_distance_for_polygon_expansion: 30.0
        upper_distance_for_polygon_expansion: 100.0
      target_filtering:
        target_type:
          car: true
          truck: false
          bus: false
          trailer: false
          unknown: true
          bicycle: false
          motorcycle: false
          pedestrian: false
        object_check_goal_distance: 20.0
        object_check_return_pose_distance: 20.0
        max_compensation_time: 2.0
        detection_area:
          static: false
          min_forward_distance: 50.0
          max_forward_distance: 150.0
          backward_distance: 10.0
        parked_vehicle:
          th_offset_from_centerline: 1.0
          th_shiftable_ratio: 0.8
          min_road_shoulder_width: 0.5
        merging_vehicle:
          th_overhang_distance: 0.0
        unstable_classification_time: 0.0
        avoidance_for_ambiguous_vehicle:
          policy: auto
          condition:
            th_stopped_time: 3.0
            th_moving_distance: 1.0
          ignore_area:
            traffic_light:
              front_distance: 20.0
            crosswalk:
              front_distance: 20.0
              behind_distance: 0.0
          wait_and_see:
            target_behaviors:
            - MERGING
            - DEVIATING
            th_closest_distance: 10.0
        avoidance_for_parking_violation_vehicle:
          policy: ignore
          condition:
            th_road_border_distance: 0.8
        avoidance_for_adjacent_lane_stop_vehicle:
          policy: auto
        avoidance_for_close_vehicle:
          policy: ignore
        intersection:
          yaw_deviation: 0.349
        freespace:
          condition:
            th_stopped_time: 5.0
      safety_check:
        target_type:
          car: true
          truck: false
          bus: false
          trailer: false
          unknown: true
          bicycle: false
          motorcycle: false
          pedestrian: true
        enable: true
        check_current_lane: false
        check_shift_side_lane: true
        check_other_side_lane: false
        check_unavoidable_object: true
        check_other_object: true
        check_all_predicted_path: false
        safety_check_backward_distance: 100.0
        hysteresis_factor_expand_rate: 1.5
        hysteresis_factor_safe_count: 3
        collision_check_yaw_diff_threshold: 3.1416
        min_velocity: 1.38
        max_velocity: 50.0
        time_resolution: 0.5
        time_horizon_for_front_object: 3.0
        time_horizon_for_rear_object: 10.0
        delay_until_departure: 0.0
        extended_polygon_policy: along_path
        expected_front_deceleration: -1.0
        expected_rear_deceleration: -1.0
        rear_vehicle_reaction_time: 2.0
        rear_vehicle_safety_time_margin: 1.0
        lateral_distance_max_threshold: 2.0
        longitudinal_distance_min_threshold: 3.0
        longitudinal_velocity_delta_time: 0.0
      avoidance:
        lateral:
          th_avoid_execution: 0.09
          th_small_shift_length: 0.101
          soft_drivable_bound_margin: 0.3
          hard_drivable_bound_margin: 0.3
          max_right_shift_length: 5.5
          max_left_shift_length: 5.5
          max_deviation_from_lane: 0.2
          ratio_for_return_shift_approval: 0.5
        longitudinal:
          min_prepare_time: 0.0
          max_prepare_time: 0.1
          min_prepare_distance: 0.0
          min_slow_down_speed: 1.38
          buf_slow_down_speed: 0.56
          nominal_avoidance_speed: 1.39
          consider_front_overhang: true
          consider_rear_overhang: true
        return_dead_line:
          goal:
            enable: true
            buffer: 3.0
          traffic_light:
            enable: true
            buffer: 3.0
      cancel:
        enable: true
        force:
          duration_time: 2.0
      yield:
        enable: true
        enable_during_shifting: false
        enable_signalling_during_yield: false
      stop:
        max_distance: 20.0
        stop_buffer: 1.0
      policy:
        detection_reliability: reliable
        make_approval_request: per_shift_line
        deceleration: best_effort
        lateral_margin: best_effort
        use_shorten_margin_immediately: true
        candidate_path_turn_signal: none
        turn_signal_on_approval_hold_duration: 3.0
      constraints:
        lateral:
          velocity:
          - 1.39
          - 4.17
          - 11.1
          max_accel_values:
          - 0.385
          - 0.385
          - 0.385
          min_jerk_values:
            avoid:
            - 0.77
            - 0.77
            - 0.77
            return:
            - 0.77
            - 0.77
            - 0.77
          max_jerk_values:
          - 0.77
          - 0.77
          - 0.77
        longitudinal:
          nominal_deceleration: -0.7
          nominal_jerk: 0.35
          max_deceleration: -1.05
          max_jerk: 0.7
          max_acceleration: 0.385
          min_velocity_to_limit_max_acceleration: 2.78
      path_generation_method: shift_line_base
      shift_line_pipeline:
        trim:
          quantize_size: 0.1
          th_similar_grad_1: 0.1
          th_similar_grad_2: 0.2
          th_similar_grad_3: 0.5
      debug:
        enable_other_objects_marker: true
        enable_other_objects_info: true
        enable_detection_area_marker: false
        enable_drivable_bound_marker: false
        enable_safety_check_marker: false
        enable_shift_line_marker: false
        enable_lane_marker: false
        enable_misc_marker: false
